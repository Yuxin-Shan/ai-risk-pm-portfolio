    <rect x="782" y="1386" width="120" height="26" rx="7" fill="#FFF4E5" stroke="#E8C87A" stroke-width="1"/>
    <text x="796" y="1404" font-size="12" font-weight="600" fill="#7A5410">待授权</text>
    <text x="782" y="1436" font-size="12" font-weight="500" fill="#5B7A9B">在线 Agent 可调用:否</text>
    <text x="782" y="1462" font-size="12" font-weight="500" fill="#5B7A9B">已调用次数:0</text>
    <text x="782" y="1488" font-size="11" font-weight="500" fill="#8A9BB0">确认前这一栏不会变 —— 这</text>
    <text x="782" y="1508" font-size="11" font-weight="500" fill="#8A9BB0">就是"未授权调不了"的证据</text>

    <rect x="1124" y="1344" width="284" height="196" rx="10" fill="#F4F7FB" stroke="#DCE5F0" stroke-width="1"/>
    <text x="1142" y="1372" font-size="13" font-weight="650" fill="#1A3A5C">确认后</text>
    <text x="1142" y="1400" font-size="12" font-weight="500" fill="#3C5570">授权状态 → 已生效</text>
    <text x="1142" y="1424" font-size="12" font-weight="500" fill="#3C5570">工具进入该 Agent 可调用清单</text>
    <text x="1142" y="1448" font-size="12" font-weight="500" fill="#3C5570">后续取证可调用,记录按案件可查</text>
    <rect x="1142" y="1466" width="120" height="26" rx="7" fill="#F0FAF6" stroke="#9AD7C4" stroke-width="1"/>
    <text x="1156" y="1484" font-size="12" font-weight="600" fill="#0E6B52">已生效</text>
    <text x="1142" y="1512" font-size="11" font-weight="500" fill="#3C7A62">可在实时监控案件详情看到调用</text>
    <text x="1142" y="1532" font-size="11" font-weight="500" fill="#3C7A62">再回工具台按案件编号对账(W6 → W3)</text>

    <rect x="124" y="1552" width="160" height="40" rx="9" fill="#12233A"/>
    <text x="148" y="1577" font-size="13" font-weight="650" fill="#FFFFFF">确认授权</text>
    <rect x="296" y="1552" width="132" height="40" rx="9" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1.5"/>
    <text x="320" y="1577" font-size="13" font-weight="600" fill="#3C5570">拒绝并说明</text>
    <text x="444" y="1577" font-size="11" font-weight="500" fill="#8A9BB0">拒绝后状态回"待授权",工具台侧可见拒绝原因,可修改后重新生成包</text>

    <text x="124" y="1616" font-size="12" font-weight="600" fill="#8A9BB0">W6 · 模型服务工具授权包:衔接点 ② 的落地页 —— 人在这里审参数、点确认或拒绝</text>
