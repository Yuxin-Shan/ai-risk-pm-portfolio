<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1196" width="1560" height="1196" font-family="Noto Sans SC" role="img" aria-labelledby="title desc">
  <title id="title">低保真线框 · 对话窗口(六帧)</title>
  <desc id="desc">对话窗口是 AI 工作台的主界面。六帧分别展示空态、执行计划、执行中、待确认卡片、提问反问、执行失败。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B3352" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1560" height="1196" fill="url(#bg)"/>
  <circle cx="160" cy="100" r="60" fill="#2F6BFF" opacity="0.05"/>
  <circle cx="1380" cy="1020" r="70" fill="#12B39A" opacity="0.05"/>

  <!-- title -->
  <text x="96" y="72" font-size="30" font-weight="700" fill="#12233A">对话窗口 · 低保真线框</text>
  <text x="96" y="104" font-size="15" font-weight="500" fill="#5B7A9B">AI 工作台主界面 · 六帧(S1—S6)· 结构表达,不做视觉设计</text>

  <!-- ============ 帧 1:空态 ============ -->
  <g>
    <rect x="96" y="136" width="664" height="396" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="96" y="136" width="664" height="44" rx="14" fill="#EEF2F7"/>
    <rect x="96" y="166" width="664" height="14" fill="#EEF2F7"/>
    <circle cx="120" cy="158" r="7" fill="#C7D4E4"/>
    <text x="140" y="164" font-size="16" font-weight="650" fill="#12233A">对话窗口</text>
    <text x="444" y="164" font-size="13" font-weight="500" fill="#8A9BB0">AI 工作台 · 主界面</text>

    <text x="124" y="222" font-size="20" font-weight="700" fill="#12233A">今天想做什么?</text>
    <text x="124" y="250" font-size="14" font-weight="500" fill="#5B7A9B">用一句话说需求,工作台会拆成可确认的执行计划。</text>

    <rect x="124" y="276" width="608" height="44" rx="10" fill="#F4F7FB" stroke="#DCE5F0" stroke-width="1"/>
    <text x="142" y="304" font-size="14" font-weight="500" fill="#3C5570">验证一下新版提示词的效果</text>
    <rect x="124" y="332" width="290" height="40" rx="10" fill="#F4F7FB" stroke="#DCE5F0" stroke-width="1"/>
    <text x="142" y="358" font-size="14" font-weight="500" fill="#3C5570">回放昨天 14:00–14:15 那段</text>
    <rect x="428" y="332" width="304" height="40" rx="10" fill="#F4F7FB" stroke="#DCE5F0" stroke-width="1"/>
    <text x="446" y="358" font-size="14" font-weight="500" fill="#3C5570">把上周那批转账案件重跑一遍</text>

    <line x1="124" y1="430" x2="732" y2="430" stroke="#E4EAF3" stroke-width="1"/>
    <rect x="124" y="452" width="500" height="44" rx="10" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1.5"/>
    <text x="142" y="480" font-size="14" font-weight="500" fill="#A9B8C9">输入需求…</text>
    <rect x="640" y="452" width="92" height="44" rx="10" fill="#12233A"/>
    <text x="668" y="480" font-size="14" font-weight="650" fill="#FFFFFF">发送</text>

    <text x="124" y="518" font-size="12" font-weight="600" fill="#8A9BB0">S1 · 空态:输入框聚焦,给三条示例需求</text>
  </g>

  <!-- ============ 帧 2:执行计划 ============ -->
  <g>
    <rect x="800" y="136" width="664" height="396" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="800" y="136" width="664" height="44" rx="14" fill="#EEF2F7"/>
    <rect x="800" y="166" width="664" height="14" fill="#EEF2F7"/>
    <circle cx="824" cy="158" r="7" fill="#C7D4E4"/>
    <text x="844" y="164" font-size="16" font-weight="650" fill="#12233A">对话窗口</text>

    <rect x="828" y="204" width="380" height="42" rx="10" fill="#E7EEF9"/>
    <text x="844" y="231" font-size="14" font-weight="500" fill="#1A3A5C">验证一下新版提示词的效果,跟现网比</text>

    <rect x="828" y="262" width="608" height="196" rx="10" fill="#FFFFFF" stroke="#B9CBE2" stroke-width="1.5"/>
    <text x="848" y="292" font-size="15" font-weight="700" fill="#12233A">执行计划</text>
    <text x="1360" y="292" font-size="12" font-weight="600" fill="#5B7A9B">待确认</text>

    <text x="848" y="324" font-size="13" font-weight="500" fill="#3C5570">① 建实验:新版 prompt  vs  现网基线</text>
    <text x="848" y="352" font-size="13" font-weight="500" fill="#3C5570">② 取数据集:上周转账案件 3,812 笔</text>
    <text x="848" y="380" font-size="13" font-weight="500" fill="#3C5570">③ 建两组任务入队</text>
    <text x="848" y="408" font-size="13" font-weight="500" fill="#3C5570">④ 完成后出对比结果</text>

    <rect x="848" y="424" width="112" height="26" rx="7" fill="#12233A"/>
    <text x="868" y="442" font-size="12" font-weight="650" fill="#FFFFFF">确认执行</text>
    <rect x="970" y="424" width="86" height="26" rx="7" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1"/>
    <text x="990" y="442" font-size="12" font-weight="600" fill="#3C5570">改一下</text>
    <rect x="1066" y="424" width="72" height="26" rx="7" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1"/>
    <text x="1086" y="442" font-size="12" font-weight="600" fill="#3C5570">取消</text>

    <line x1="828" y1="478" x2="1436" y2="478" stroke="#E4EAF3" stroke-width="1"/>
    <rect x="828" y="478" width="500" height="30" rx="8" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1.5"/>
    <text x="844" y="498" font-size="13" font-weight="500" fill="#A9B8C9">输入需求…</text>

    <text x="828" y="524" font-size="12" font-weight="600" fill="#8A9BB0">S2 · 执行计划:四步拆解 + 三个动作</text>
  </g>

  <!-- ============ 帧 3:执行中 ============ -->
  <g>
    <rect x="96" y="556" width="664" height="396" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="96" y="556" width="664" height="44" rx="14" fill="#EEF2F7"/>
    <rect x="96" y="586" width="664" height="14" fill="#EEF2F7"/>
    <circle cx="120" cy="578" r="7" fill="#C7D4E4"/>
    <text x="140" y="584" font-size="16" font-weight="650" fill="#12233A">对话窗口</text>

    <rect x="124" y="624" width="380" height="38" rx="10" fill="#E7EEF9"/>
    <text x="140" y="648" font-size="13" font-weight="500" fill="#1A3A5C">先停一下,把可疑样本的手法特征也带上</text>

    <rect x="124" y="672" width="608" height="34" rx="9" fill="#F0F5FA" stroke="#DCE5F0" stroke-width="1"/>
    <text x="142" y="694" font-size="13" font-weight="500" fill="#1A3A5C">收到,已加进任务参数,重跑第 2 组。</text>

    <rect x="124" y="720" width="608" height="76" rx="10" fill="#FFFFFF" stroke="#B9CBE2" stroke-width="1.5"/>
    <text x="142" y="746" font-size="14" font-weight="650" fill="#12233A">执行中 · 2/4</text>
    <text x="606" y="746" font-size="12" font-weight="500" fill="#5B7A9B">预计 12 分钟</text>
    <rect x="142" y="760" width="572" height="14" rx="7" fill="#E4EAF3"/>
    <rect x="142" y="760" width="286" height="14" rx="7" fill="#2F6BFF"/>
    <text x="142" y="790" font-size="12" font-weight="500" fill="#3C5570">当前:第 2 组任务执行中 · 可随时插话</text>

    <rect x="124" y="810" width="608" height="52" rx="10" fill="#FBFCFE" stroke="#DCE5F0" stroke-width="1"/>
    <text x="142" y="834" font-size="13" font-weight="650" fill="#1A3A5C">更新后的执行计划</text>
    <text x="142" y="854" font-size="12" font-weight="500" fill="#5B7A9B">第 2 组已带上"手法特征"参数重跑;第 1 组结果标注"基于旧参数"</text>

    <line x1="124" y1="884" x2="732" y2="884" stroke="#E4EAF3" stroke-width="1"/>
    <rect x="124" y="896" width="500" height="36" rx="9" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1.5"/>
    <text x="142" y="919" font-size="13" font-weight="500" fill="#A9B8C9">输入需求…</text>

    <text x="124" y="944" font-size="12" font-weight="600" fill="#8A9BB0">S3 · 执行中:进度 + 插话后计划更新,旧结果不丢弃</text>
  </g>

  <!-- ============ 帧 4:待确认卡片 ============ -->
  <g>
    <rect x="800" y="556" width="664" height="396" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="800" y="556" width="664" height="44" rx="14" fill="#EEF2F7"/>
    <rect x="800" y="586" width="664" height="14" fill="#EEF2F7"/>
    <circle cx="824" cy="578" r="7" fill="#C7D4E4"/>
    <text x="844" y="584" font-size="16" font-weight="650" fill="#12233A">对话窗口</text>

    <rect x="828" y="624" width="380" height="38" rx="10" fill="#E7EEF9"/>
    <text x="844" y="648" font-size="13" font-weight="500" fill="#1A3A5C">把上周那批转账案件重跑一遍</text>

    <rect x="828" y="674" width="608" height="216" rx="12" fill="#FFFBF0" stroke="#E8C87A" stroke-width="1.5"/>
    <rect x="828" y="674" width="6" height="216" rx="3" fill="#E0A93C"/>
    <text x="852" y="706" font-size="16" font-weight="700" fill="#7A5410">需要你确认</text>
    <text x="852" y="736" font-size="13" font-weight="500" fill="#7A5410">准备对 3,812 笔历史转账案件执行重跑。</text>

    <rect x="852" y="752" width="560" height="64" rx="8" fill="#FFFFFF" stroke="#EDDCB4" stroke-width="1"/>
    <text x="868" y="774" font-size="12" font-weight="600" fill="#8A7040">参数</text>
    <text x="868" y="794" font-size="12" font-weight="500" fill="#8A7040">时间窗:上周一 00:00 – 周日 24:00</text>
    <text x="868" y="810" font-size="12" font-weight="500" fill="#8A7040">Agent 版本:v3(新版提示词)</text>

    <rect x="852" y="830" width="112" height="34" rx="8" fill="#12233A"/>
    <text x="872" y="852" font-size="13" font-weight="650" fill="#FFFFFF">确认执行</text>
    <rect x="974" y="830" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#D9BE86" stroke-width="1"/>
    <text x="994" y="852" font-size="13" font-weight="600" fill="#7A5410">改参数</text>
    <rect x="1080" y="830" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#D9BE86" stroke-width="1"/>
    <text x="1102" y="852" font-size="13" font-weight="600" fill="#7A5410">取消</text>

    <text x="852" y="882" font-size="12" font-weight="500" fill="#A9873C">卡片挂着不答复时,任务停在原地,不自动往下走。</text>

    <line x1="828" y1="894" x2="1436" y2="894" stroke="#E4EAF3" stroke-width="1"/>
    <rect x="828" y="900" width="500" height="30" rx="8" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1.5"/>
    <text x="844" y="920" font-size="13" font-weight="500" fill="#A9B8C9">也可以直接回话:确认 / 取消</text>

    <text x="828" y="944" font-size="12" font-weight="600" fill="#8A9BB0">S4 · 待确认:点卡片或回话都算答复</text>
  </g>

  <!-- ============ 帧 5:反问(工具不唯一) ============ -->
  <g>
    <rect x="96" y="976" width="664" height="128" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="96" y="976" width="664" height="40" rx="14" fill="#EEF2F7"/>
    <rect x="96" y="1002" width="664" height="14" fill="#EEF2F7"/>
    <text x="140" y="1002" font-size="15" font-weight="650" fill="#12233A">对话窗口</text>
    <rect x="120" y="1026" width="260" height="30" rx="9" fill="#E7EEF9"/>
    <text x="134" y="1046" font-size="12" font-weight="500" fill="#1A3A5C">把这批案件再查一遍</text>
    <rect x="390" y="1026" width="366" height="30" rx="9" fill="#F0F5FA" stroke="#DCE5F0" stroke-width="1"/>
    <text x="404" y="1046" font-size="12" font-weight="500" fill="#1A3A5C">找到 3 个工具,请选一个 ▾</text>
    <text x="120" y="1080" font-size="12" font-weight="600" fill="#8A9BB0">S5 · 反问:匹配不唯一时列候选,不臆造工具</text>
  </g>

  <!-- ============ 帧 6:执行失败 ============ -->
  <g>
    <rect x="800" y="976" width="664" height="128" rx="14" fill="url(#frame)" stroke="#C7D4E4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="800" y="976" width="664" height="40" rx="14" fill="#EEF2F7"/>
    <rect x="800" y="1002" width="664" height="14" fill="#EEF2F7"/>
    <text x="844" y="1002" font-size="15" font-weight="650" fill="#12233A">对话窗口</text>
    <rect x="824" y="1026" width="616" height="30" rx="9" fill="#FDF2F2" stroke="#E8B4B4" stroke-width="1"/>
    <text x="840" y="1046" font-size="12" font-weight="500" fill="#8A2B2B">第 3 步失败:数据集"上周转账案件"不存在,请换一个。</text>
    <rect x="824" y="1062" width="96" height="26" rx="7" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1"/>
    <text x="842" y="1080" font-size="12" font-weight="600" fill="#3C5570">换数据集</text>
    <rect x="930" y="1062" width="76" height="26" rx="7" fill="#FFFFFF" stroke="#C7D4E4" stroke-width="1"/>
    <text x="948" y="1080" font-size="12" font-weight="600" fill="#3C5570">重试</text>
    <text x="1024" y="1080" font-size="12" font-weight="600" fill="#8A9BB0">S6 · 失败:说清哪步失败 + 给下一步动作</text>
  </g>
</svg>
