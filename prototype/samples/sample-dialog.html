<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AI 风控运营工作台对话窗口。">
  <title>对话操作台</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dialog.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 8h8M8 12h5"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7 15h10"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5-5l2.1 2.1-2.4 2.4-2.1-2.1a4 4 0 0 0 5 5L20 16.4a2.1 2.1 0 0 1-3 3l-7.7-7.7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
  </svg>
  <div class="app">
    <header class="global">
      <div class="honesty"><strong>个人作品 · 虚构模拟数据</strong></div>
      <div class="global-meta"><span>离线工作台</span><span>23:08 更新</span></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="mark"><svg class="icon"><use href="#i-shield"/></svg></div><div class="brand-title">风险运营中枢</div></div>
        <nav aria-label="主导航">
          <div class="nav-section"><div class="nav-label">在线风控</div>
            <a class="nav-item" href="../pages/strategy-engine.html"><svg><use href="#i-grid"/></svg>策略引擎配置</a>
            <a class="nav-item" href="../pages/model-service.html"><svg><use href="#i-shield"/></svg>模型服务</a>
            <a class="nav-item" href="../pages/realtime-monitor.html"><svg><use href="#i-activity"/></svg>实时监控</a>
          </div>
          <div class="nav-section"><div class="nav-label">工作台</div>
            <a class="nav-item active" aria-current="page" href="sample-dialog.html"><svg><use href="#i-message"/></svg>对话操作台</a>
            <a class="nav-item" href="../pages/experiment-management.html"><svg><use href="#i-flask"/></svg>实验管理</a>
            <a class="nav-item" href="../pages/agent-config.html"><svg><use href="#i-shield"/></svg>Agent 配置</a>
            <a class="nav-item" href="../pages/toolbench.html"><svg><use href="#i-tool"/></svg>工具台</a>
            <a class="nav-item" href="../pages/task-queue.html"><svg><use href="#i-list"/></svg>任务队列</a>
            <a class="nav-item" href="../pages/evidence-chain.html"><svg><use href="#i-list"/></svg>证据链视图</a>
            <a class="nav-item" href="../pages/validation-report.html"><svg><use href="#i-grid"/></svg>验证报告</a>
          </div>
          <div class="nav-section"><div class="nav-label">基础资产与排查</div>
            <a class="nav-item" href="../pages/lists.html"><svg><use href="#i-list"/></svg>名单管理</a>
            <a class="nav-item" href="../pages/features.html"><svg><use href="#i-activity"/></svg>特征发布</a>
            <a class="nav-item" href="../pages/datasets.html"><svg><use href="#i-grid"/></svg>数据集管理</a>
            <a class="nav-item" href="../pages/log-replay.html"><svg><use href="#i-activity"/></svg>日志回放</a>
          </div>
        </nav>
      </aside>

      <main class="main">
        <header class="main-head">
          <h1 id="task-title">对话操作台</h1>
          <div class="main-actions">
            <button class="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">导航</button>
            <div class="run-indicator neutral" id="run-indicator" role="status" aria-live="polite"><span class="run-indicator-dot"></span><span id="run-indicator-text">空闲</span></div>
            <button class="ghost" id="pause" type="button" aria-pressed="false">暂停任务</button>
            <button class="objects-toggle" aria-controls="objects" aria-expanded="false">会话对象</button>
          </div>
        </header>
        <section class="scroll" aria-live="polite"><div id="content" class="conversation" role="log" aria-label="对话记录"></div></section>
        <form class="composer" id="composer"><div class="composer-inner"><textarea id="prompt" rows="1" aria-label="输入需求" placeholder="描述要验证的风险运营任务…"></textarea><button class="send" aria-label="发送" type="submit"><svg class="icon"><use href="#i-send"/></svg></button></div></form>
      </main>

      <aside class="objects" id="objects" aria-label="任务执行侧栏" tabindex="-1"><div id="right-rail-content"></div></aside>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script defer src="../assets/js/fixtures.js"></script>
  <script defer src="../assets/js/core.js"></script>
  <script defer src="../assets/js/icons.js"></script>
  <script defer src="../assets/js/components.js"></script>
  <script defer src="../assets/js/shell.js"></script>
  <script defer src="../assets/js/pages/dialog.js"></script>
</body>
</html>
